<!DOCTYPE html>
<html>

<head>
    <title>祠堂成员名录</title>
    <link rel="shortcut icon" type="image/x-icon" href="../../image/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <script src="js/qrcode.min.js"></script>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- ========== 引入钱包道统一登录工具 ========== -->
    <script src="/wallet-auth.js"></script>
    <style>
        :root {
            --primary-color: #c00;
            --secondary-color: #3498db;
            --accent-color: #d4af37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif;
            background-color: #ffffff;
            color: #121212;
            padding: 20px;
            padding-top: 80px;
        }

        /* ============ Header样式 ============ */
        .header {
            background: linear-gradient(135deg, #c00, #8b0000);
            padding: 5px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 2px solid #d90007;
            margin-bottom: 20px;
        }

        .header h1 {
            flex: 1 1 100%;
            text-align: center;
            margin-bottom: 10px;
            color: #FFF;
            font-size: 1.5em;
            letter-spacing: 1px;
        }

        .login-status {
            display: none;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 1 1 100%;
            justify-content: center;
        }

        .nav-btn {
            background: #4cb7db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
            transition: background 0.3s;
        }

        .nav-btn:hover {
            background: #3a9bc7;
        }

        @media (min-width: 768px) {
            .header {
                flex-wrap: nowrap;
                padding: 15px 20px;
            }

            .header h1 {
                flex: 1;
                margin-bottom: 0;
                text-align: left;
                padding-left: 20px;
            }

            .nav-buttons {
                flex: 0 0 auto;
                justify-content: flex-end;
                margin-bottom: 0;
            }
        }

        /* ============ 卡片网格布局 ============ */
        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 24px;
            padding: 0 20px 20px;
        }

        /* 卡片样式 */
        .card {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1 / 1;
            background: #fffef5;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin: 0 auto;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #f0e2b6;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.2);
        }

        .card-layout {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* 卡片主体 */
        .card-top-section {
            flex: 9;
            min-height: 0;
            display: flex;
            flex-direction: row;
            padding: 8px;
            gap: 10px;
            background: #fffef5;
            overflow: hidden;
            cursor: pointer;
        }

        .card-left {
            flex: 1;
            background: #fffef5;
            padding: 0 8px 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            border-radius: 12px;
            min-height: 0;
        }

        .card-right {
            flex: 1;
            background: #fffef5;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            border-left: 1px solid #e8d5a8;
            border-radius: 1px;
            gap: 12px;
            min-height: 0;
        }

        .card-bottom-section {
            flex: 1;
            min-height: 0;
            padding: 8px 12px;
            background: #fffef5;
            border-top: 2px solid #e8d5a8;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .pcps-logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #fff3e0;
            padding: 1px;
            object-fit: contain;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            margin: 0px 0;
            transition: transform 0.2s;
        }

        .pcps-logo-img:hover {
            transform: scale(1.02);
        }

        .member-photo {
            width: 80px;
            height: 60px;
            border-radius: 1px;
            object-fit: cover;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            background: #ede3c9;
        }

        .member-photo-placeholder {
            width: 100px;
            height: 60px;
            border-radius: 1px;
            background: #ede3c9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b7a5c;
            font-size: 10px;
            text-align: center;
            font-style: italic;
        }

        .year-logo-img {
            width: 100%;
            height: auto;
            max-width: 100%;
            object-fit: contain;
            filter: none;
            opacity: 0.85;
            margin: 5px 0;
            transition: transform 0.2s;
        }

        .year-logo-img:hover {
            transform: scale(1.02);
        }

        .citang-name-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: #000;
            text-align: center;
            margin-top: 0px;
        }

        .member-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #3d2a1a;
            text-align: center;
            letter-spacing: 3px;
            text-shadow: none;
            font-family: "KaiTi", "楷体", "Microsoft YaHei", serif;
            margin: 0px 0 0px;
            word-break: keep-all;
        }

        .qr-wrapper {
            background: white;
            padding: 5px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .qrcode {
            width: 120px;
            height: 120px;
            display: block;
        }

        .nft-display {
            background: #fff5e0;
            border-radius: 8px;
            padding: 1px 1px;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;
            color: #3a2c1f;
            word-break: break-all;
            text-align: center;
            border: 1px solid #e2cfaa;
            max-height: 130px;
            width: 100%;
            margin-top: 0px;
        }

        .card-number-tag {
            font-size: 0.7rem;
            background: #e8d5a8;
            padding: 4px 10px;
            border-radius: 30px;
            color: #4a2a10;
            font-weight: 600;
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 10;
        }

        .button-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .nft-transaction-btn {
            background: linear-gradient(135deg, #b8860b, #8b6508);
            color: #000000;
            border: none;
            padding: 1px 1px;
            padding-left: 30px;
            padding-right: 30px;
            font-size: 1.8rem;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .nft-transaction-btn:hover {
            background: linear-gradient(135deg, #9a6e0a, #6b4f06);
            transform: scale(0.98);
            color: #000000;
        }

        .button-container-top {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin: 25px auto !important;
            width: 100% !important;
            max-width: 100% !important;
        }

        .add-member-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #28a745, #218838);
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .add-member-btn:hover:not(:disabled) {
            transform: scale(1.02);
        }

        .add-member-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #addMemberHint,
        #viewMemberHint {
            text-align: center;
            margin-top: 10px;
            color: #555;
            font-size: 16px;
        }

        #addMemberPermissionHint {
            text-align: center;
            margin-top: 5px;
            color: #666;
            font-size: 14px;
        }

        /* ============ 移动端优化 ============ */
        @media (max-width: 768px) {
            .member-grid {
                grid-template-columns: 1fr;
                padding: 0 12px;
            }
            .card {
                max-width: 100%;
                aspect-ratio: 1 / 1;
                overflow: visible;
            }
            .card-top-section {
                padding: 8px;
                gap: 10px;
            }
            .card-left {
                padding: 0 8px 10px 8px;
                gap: 12px;
            }
            .card-right {
                padding: 10px 8px;
                gap: 14px;
                justify-content: flex-start;
            }
            .pcps-logo-img {
                width: 130px;
                height: 130px;
            }
            .member-photo,
            .member-photo-placeholder {
                width: 100px;
                height: 55px;
            }
            .year-logo-img {
                width: 140px;
                margin: 4px 0;
            }
            .member-name {
                font-size: 2rem;
                letter-spacing: 2px;
            }
            .card-bottom-section {
                padding: 8px 12px;
            }
            .nft-transaction-btn {
                padding: 5px 8px;
                font-size: 0.68rem;
                color: #000000;
            }
        }

        @media (max-width: 480px) {
            .card-top-section {
                padding: 8px;
                gap: 10px;
            }
            .card-left {
                padding: 0 6px 8px 6px;
                gap: 10px;
            }
            .card-right {
                padding: 0;
                gap: 8px;
            }
            .qr-wrapper {
                padding: 0;
                background: white;
                border-radius: 12px 12px 0 0;
                width: 100%;
                min-height: 160px;
                display: flex;
                justify-content: center;
                align-items: center;
                margin: 0;
                margin-top: 10px;
                margin-bottom: 5px;
            }
            .qrcode {
                width: 100% !important;
                height: auto !important;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 10px;
            }
            .qr-wrapper canvas,
            .qr-wrapper img {
                width: 160px !important;
                height: 160px !important;
                max-width: 160px;
                max-height: 160px;
                display: block;
                margin: 0 auto;
            }
            .qr-wrapper>div:not(.qrcode) {
                width: 160px !important;
                height: 160px !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                background: #f0f0f0;
                color: #999;
                font-size: 12px;
                text-align: center;
                margin: 0 auto;
            }
            .pcps-logo-img {
                width: 130px;
                height: 130px;
            }
            .member-photo,
            .member-photo-placeholder {
                width: 130px;
                height: 70px;
            }
            .year-logo-img {
                width: 100px;
            }
            .member-name {
                padding-top: 0px;
                font-size: 2rem;
                letter-spacing: 1px;
            }
            .nft-display {
                font-size: 11px;
                max-height: 90px;
                padding: 6px 8px;
                margin: 0 6px 6px 6px;
                border-radius: 8px;
            }
            .card-bottom-section {
                padding: 6px 8px;
            }
            .nft-transaction-btn {
                padding: 4px 6px;
                padding-left: 30px;
                padding-right: 30px;
                font-size: 26px;
                color: #000000;
            }
        }

        @media (max-width: 768px) and (orientation: landscape) {
            .card {
                max-width: 460px;
                margin: 0 auto;
            }
            .qr-wrapper canvas,
            .qr-wrapper img {
                width: 140px !important;
                height: 140px !important;
            }
        }

        /* ============ 成员姓名输入框提醒样式 ============ */
        .member-name-input-error {
            border-color: #f44336 !important;
            background-color: #fff0f0 !important;
        }

        .member-name-hint {
            color: #f44336;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .member-name-hint.show {
            display: block;
        }

        /* ============ 模态框 ============ */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: black;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .child-item {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            align-items: center;
            animation: fadeInUp 0.2s ease;
        }

        .child-item .child-name-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .child-item .child-name-input:focus {
            outline: none;
            border-color: #4cb7db;
            box-shadow: 0 0 0 2px rgba(76, 183, 219, 0.1);
        }

        .child-item .remove-child-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .child-item .remove-child-btn:hover {
            background: #ee5a5a;
            transform: scale(1.02);
        }

        #addChildBtn {
            margin-top: 8px;
            background: linear-gradient(135deg, #4cb7db, #3a9bc7);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        #addChildBtn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
            display: block;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            display: block;
        }

        /* 操作状态提示 */
        .operation-status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 100;
            animation: fadeIn 0.3s ease;
            pointer-events: none;
        }

        .processing-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        .button-processing {
            position: relative;
            color: transparent !important;
            pointer-events: none;
        }

        .button-processing::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .status-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .status-modal {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .status-modal h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .status-modal .progress-bar {
            width: 100%;
            height: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }

        .status-modal .progress {
            height: 100%;
            background: linear-gradient(90deg, #4cb7db, #28a745);
            width: 0%;
            transition: width 0.3s ease;
        }

        .custom-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
            padding: 20px 25px;
            max-width: 320px;
            text-align: center;
            z-index: 3000;
            display: none;
        }

        .custom-toast .toast-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #d32f2f;
        }

        .custom-toast .toast-msg {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #333;
        }

        .custom-toast .toast-close {
            background: #1e88e5;
            color: white;
            border: none;
            padding: 6px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: .95rem;
        }

        .custom-toast .toast-close:hover {
            background: #1565c0;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .back-btn-bottom {
            padding: 12px 24px;
            background: #1e88e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.16);
        }

        .back-btn-bottom:hover {
            background: #1565c0;
            transform: translateY(-2px);
            box-shadow: 0 5px 8px rgba(0, 0, 0, 0.2);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1 id="introduce">祠堂成员名录</h1>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="goBackToCitangDetail()">返回上一页</button>
            <a href="index_main.html" class="nav-btn">返回首页</a>
            <button class="nav-btn" onclick="window.location.href = '/NFT_market.html'">NFT交易市场</button>
        </div>
    </div>

    <div class="button-container-top" id="addMemberContainer" style="display: none;">
        <button class="add-member-btn" onclick="handleAddMemberClick()">添加成员</button>
    </div>
    <div style="text-align:center;margin-top:10px;color:#555;font-size:16px;" id="addMemberHint"></div>
    <div style="text-align:center;margin-top:5px;color:#666;font-size:14px;" id="addMemberPermissionHint"></div>

    <div class="member-grid" id="membersContainer">
        <div class="loading">正在加载成员数据...</div>
    </div>

    <div class="button-container">
        <button class="back-btn-bottom" onclick="scrollToTop()">返回顶部</button>
    </div>

    <!-- 添加成员模态框 -->
    <div class="modal" id="addMemberModal">
        <div class="modal-content">
            <span class="close" onclick="closeAddMemberForm()">&times;</span>
            <h3>添加新成员</h3>
            <form id="addMemberForm">
                <div class="form-group">
                    <label for="name">姓名：（写后不可以更改）</label>
                    <input type="text" id="name" required>
                    <div class="member-name-hint" id="memberNameHint">⚠️ 第一个字符不能是数字</div>
                </div>
                <div class="form-group">
                    <label for="birth">出生日期：</label>
                    <input type="text" id="birth" placeholder="YYYY-MM-DD">
                </div>
                <div class="form-group">
                    <label for="birthplace">出生地：</label>
                    <input type="text" id="birthplace">
                </div>
                <div class="form-group">
                    <label for="gender">性别：</label>
                    <select id="gender">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="spouse">配偶：</label>
                    <input type="text" id="spouse">
                </div>
                <div class="form-group">
                    <label>儿女列表：</label>
                    <div id="childrenList">
                        <div class="child-item" style="display: flex; gap: 10px; margin-bottom: 8px; align-items: center;">
                            <input type="text" class="child-name-input" placeholder="请输入儿女姓名" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                            <button type="button" class="remove-child-btn" style="background: #f44336; color: white; border: none; border-radius: 4px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; display: none;">✕</button>
                        </div>
                    </div>
                    <button type="button" id="addChildBtn" style="margin-top: 8px; background: #4cb7db; color: white; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 14px;">
                        + 添加儿女
                    </button>
                    <small style="color: #666; margin-top: 5px; display: block;">点击"+ 添加儿女"按钮可添加多个儿女</small>
                </div>
                <div class="form-group">
                    <label for="death_date">卒时间：</label>
                    <input type="text" id="death_date" placeholder="YYYY-MM-DD">
                </div>
                <div class="form-group">
                    <label for="death_place">卒地点：</label>
                    <input type="text" id="death_place">
                </div>
                <button type="button" onclick="addNewMember()">保存</button>
            </form>
        </div>
    </div>

    <div id="statusOverlay" class="status-overlay" style="display: none;">
        <div class="status-modal">
            <h3 id="statusTitle">系统处理中</h3>
            <div id="statusMessage">正在处理您的请求，请稍候...</div>
            <div class="progress-bar">
                <div class="progress" id="statusProgress"></div>
            </div>
        </div>
    </div>

    <div id="customToast" class="custom-toast">
        <div class="toast-title">提示</div>
        <div class="toast-msg"></div>
        <button class="toast-close" onclick="hideCustomToast()">确定</button>
    </div>

    <script>
        // ========== 全局变量 ==========
        let allMembers = [];
        let currentSurname = '';
        let currentCitangNumber = '';
        let currentCardNumber = '';
        let currentCitangName = '';
        let currentCitangHash = '';
        let currentCitangOwner = '';
        let ownsCitang = false;
        let privacyLevel = 'public';
        let loginPurpose = ''; // 'add'
        let pendingAddAfterLogin = false;

        // ============ 成员照片缓存 ============
        let memberPhotoCache = {};

        // ============ 使用 wallet-auth.js 的登录状态 ============
        function checkLoginStatus() {
            return checkWalletLoginStatus();
        }

        function clearUserSession() {
            clearWalletLogin();
            ownsCitang = false;
        }

        function logoutAndRefresh() {
            clearUserSession();
            location.reload();
        }

        function logout() {
            clearWalletLogin();
            ownsCitang = false;
            console.log('用户已退出登录');
        }

        // ============ 儿女列表管理 ============
        let childCounter = 1;

        function initChildrenList() {
            var childrenList = document.getElementById('childrenList');
            if (!childrenList) return;
            childrenList.innerHTML = '';
            addChildInput();
        }

        function addChildInput(childName) {
            childName = childName || '';
            var childrenList = document.getElementById('childrenList');
            var childDiv = document.createElement('div');
            var currentIndex = childrenList.children.length;

            childDiv.className = 'child-item';
            childDiv.style.cssText = 'display: flex; gap: 10px; margin-bottom: 8px; align-items: center;';

            childDiv.innerHTML =
                '<input type="text" class="child-name-input" placeholder="请输入儿女姓名" value="' + escapeHtml(childName) +
                '" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">' +
                '<button type="button" class="remove-child-btn" style="background: #f44336; color: white; border: none; border-radius: 4px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; ' +
                (currentIndex === 0 ? 'display: none;' : '') + '">✕</button>';

            var removeBtn = childDiv.querySelector('.remove-child-btn');
            if (removeBtn) {
                removeBtn.addEventListener('click', function() {
                    if (childrenList.children.length > 1) {
                        childDiv.remove();
                    } else {
                        var input = childDiv.querySelector('.child-name-input');
                        if (input) input.value = '';
                    }
                });
            }

            childrenList.appendChild(childDiv);

            var newInput = childDiv.querySelector('.child-name-input');
            if (newInput) {
                newInput.addEventListener('input', function(e) {});
            }
        }

        function getChildrenList() {
            var inputs = document.querySelectorAll('#childrenList .child-name-input');
            var children = [];
            inputs.forEach(function(input) {
                var value = input.value.trim();
                if (value !== '') {
                    children.push(value);
                }
            });
            return children.length > 0 ? children : ['_'];
        }

        function resetChildrenList() {
            var childrenList = document.getElementById('childrenList');
            if (!childrenList) return;
            childrenList.innerHTML = '';
            addChildInput();
        }

        // ============ 工具函数 ============
        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatWalletShort(wallet) {
            if (!wallet) return '未知';
            if (wallet.length <= 8) return wallet;
            return wallet.slice(0, 4) + '***' + wallet.slice(-4);
        }

        function formatChainShort(chain) {
            if (!chain) return '未知';
            return chain.slice(0, 4) + '...';
        }

        function getFormattedTime() {
            var now = new Date();
            var year = now.getFullYear();
            var month = String(now.getMonth() + 1).padStart(2, '0');
            var day = String(now.getDate()).padStart(2, '0');
            var hours = String(now.getHours()).padStart(2, '0');
            var minutes = String(now.getMinutes()).padStart(2, '0');
            var seconds = String(now.getSeconds()).padStart(2, '0');
            return year + '/' + month + '/' + day + ' ' + hours + ':' + minutes + ':' + seconds;
        }

        function formatHash(hash) {
            if (!hash) return '';
            var parts = hash.match(/.{1,16}/g);
            return parts ? parts.join('<br>') : '';
        }

        function getResponsiveQrSize() {
            if (window.innerWidth <= 480) return 160;
            if (window.innerWidth <= 768) return 150;
            return 120;
        }

        // ============ 预加载成员照片 ============
        async function preloadMemberPhoto(card_number, surname, citang_number, citang_name, member_number, member_name) {
            var key = card_number + '_' + surname + '_' + citang_number + '_' + citang_name + '_' + member_number + '_' +
                member_name;
            if (memberPhotoCache[key] !== undefined) return memberPhotoCache[key];

            var imageUrl = '/nft/data/' + card_number + '_' + surname + '/contents/grade_log.png';
            try {
                var controller = new AbortController();
                var timeoutId = setTimeout(function() { controller.abort(); }, 2000);
                var response = await fetch(imageUrl, { method: 'HEAD', signal: controller.signal });
                clearTimeout(timeoutId);
                memberPhotoCache[key] = response.ok ? imageUrl : null;
                return memberPhotoCache[key];
            } catch (e) {
                memberPhotoCache[key] = null;
                return null;
            }
        }

        // ============ 自定义提示 ============
        function showCustomToast(title, msg, callback) {
            callback = callback || null;
            var toast = document.getElementById('customToast');
            if (!toast) {
                console.log(title + ': ' + msg);
                if (callback) callback();
                return;
            }
            var titleEl = toast.querySelector('.toast-title');
            var msgEl = toast.querySelector('.toast-msg');
            if (titleEl) titleEl.textContent = title;
            if (msgEl) msgEl.textContent = msg;
            toast.style.display = 'block';
            var closeBtn = toast.querySelector('.toast-close');
            if (closeBtn) {
                var newCloseBtn = closeBtn.cloneNode(true);
                closeBtn.parentNode.replaceChild(newCloseBtn, closeBtn);
                newCloseBtn.onclick = function() {
                    toast.style.display = 'none';
                    if (callback && typeof callback === 'function') callback();
                };
            }
        }

        function hideCustomToast() {
            var toast = document.getElementById('customToast');
            if (toast) toast.style.display = 'none';
        }

        // ============ 检查会堂所有权 ============
        async function checkCitangOwnership() {
            var loginInfo = checkLoginStatus();
            if (!loginInfo || !currentCitangHash) {
                ownsCitang = false;
                return false;
            }
            try {
                var response = await fetch('/api/user/nfts?wallet=' + loginInfo.walletid);
                var userNFTs = await response.json();
                ownsCitang = userNFTs.some(function(nft) {
                    return nft.level === 'citang' &&
                        nft.card_number === currentCardNumber &&
                        nft.surname === currentSurname &&
                        nft.citang_number === currentCitangNumber &&
                        nft.citang_name === currentCitangName &&
                        (nft.hash === currentCitangHash || nft.realHash === currentCitangHash);
                });
                return ownsCitang;
            } catch (error) {
                console.error('检查会堂所有权失败:', error);
                ownsCitang = false;
                return false;
            }
        }

        function showPermissionDeniedToast() {
            var loginInfo = checkLoginStatus();
            var userName = loginInfo ? loginInfo.name : '用户';
            showCustomToast('权限不足', '您未拥有 ' + currentSurname + '·' + currentCitangName + ' 会堂NFT，无法添加成员\n\n点击"确定"退出登录并返回', function() {
                logoutAndRefresh();
            });
        }

        function updateAddMemberButtonVisibility() {
            var addMemberContainer = document.getElementById('addMemberContainer');
            var permissionHint = document.getElementById('addMemberPermissionHint');
            var loginInfo = checkLoginStatus();
            if (loginInfo && ownsCitang) {
                addMemberContainer.style.display = 'flex';
                permissionHint.textContent = '(' + loginInfo.name + ' 是 ' + currentSurname + '·' + currentCitangName +
                    ' 会堂NFT的当前持有人)';
            } else {
                addMemberContainer.style.display = 'none';
                permissionHint.textContent = '';
            }
        }

        // ============ 核心修改：添加成员 - 使用钱包道弹窗 ============
        function handleAddMemberClick() {
            var loginInfo = checkLoginStatus();
            if (!loginInfo) {
                loginPurpose = 'add';
                pendingAddAfterLogin = true;
                // 直接打开钱包道登录弹窗
                openWalletLogin().then(function(result) {
                    if (result && result.walletid) {
                        console.log('[citang_member.html] 登录成功，walletid:', result.walletid.substring(0, 16) +
                        '...');
                        // 重新检查所有权
                        checkCitangOwnership().then(function(owns) {
                            if (owns) {
                                openAddMemberFormDirect();
                                updateAddMemberButtonVisibility();
                            } else {
                                showPermissionDeniedToast();
                            }
                            loginPurpose = '';
                            pendingAddAfterLogin = false;
                        });
                    }
                }).catch(function(error) {
                    if (error.message === '用户取消登录') {
                        // 用户取消登录，立即退出登录并刷新
                        console.log('[citang_member.html] 用户取消登录，自动退出');
                        logoutAndRefresh();
                    } else {
                        console.error('登录失败:', error);
                        showCustomToast('登录失败：' + error.message, 'error');
                    }
                    loginPurpose = '';
                    pendingAddAfterLogin = false;
                });
            } else {
                checkAndOpenAddMemberForm();
            }
        }

        async function checkAndOpenAddMemberForm() {
            var owns = await checkCitangOwnership();
            if (owns) {
                openAddMemberFormDirect();
            } else {
                showPermissionDeniedToast();
            }
        }

        function openAddMemberFormDirect() {
            var modal = document.getElementById('addMemberModal');
            modal.style.display = 'block';
            document.getElementById('name').value = '';
            document.getElementById('birth').value = '';
            document.getElementById('birthplace').value = '';
            document.getElementById('gender').value = '男';
            document.getElementById('spouse').value = '';
            document.getElementById('death_date').value = '';
            document.getElementById('death_place').value = '';

            resetChildrenList();

            var memberNameInput = document.getElementById('name');
            var memberNameHint = document.getElementById('memberNameHint');
            if (memberNameInput) {
                memberNameInput.classList.remove('member-name-input-error');
            }
            if (memberNameHint) {
                memberNameHint.classList.remove('show');
            }
        }

        // ============ 监听登录成功事件 ============
        document.addEventListener('wallet-login-success', function(event) {
            var detail = event.detail;
            if (detail && detail.walletid) {
                console.log('[citang_member.html] 登录成功，walletid:', detail.walletid.substring(0, 16) + '...');
                if (pendingAddAfterLogin || loginPurpose === 'add') {
                    pendingAddAfterLogin = false;
                    loginPurpose = '';
                    checkCitangOwnership().then(function(owns) {
                        if (owns) {
                            openAddMemberFormDirect();
                            updateAddMemberButtonVisibility();
                        } else {
                            showPermissionDeniedToast();
                        }
                    });
                }
            }
        });

        // ============ 渲染成员卡片 ============
        async function renderMemberCard(member) {
            var qrSize = getResponsiveQrSize();
            var qrContent = (member.shortlink && member.shortlink.trim()) || (member.hash && member.hash.trim()) || '';
            var safeName = escapeHtml(member.name);
            var safeCitangName = escapeHtml(currentCitangName);
            var yearLogoUrl = '/image/1973_log.png';

            var memberPhotoUrl = await preloadMemberPhoto(currentCardNumber, currentSurname);

            var detailUrl = 'member_detail.html?surname=' + encodeURIComponent(currentSurname) + '&citang_number=' +
                currentCitangNumber + '&member_number=' + member.number + '&card_number=' + currentCardNumber +
                '&citangname=' + encodeURIComponent(currentCitangName) + '&membername=' + encodeURIComponent(member
                .name);
            var logUrl = 'member_ti_log.html?surname=' + encodeURIComponent(currentSurname) + '&citang_number=' +
                currentCitangNumber + '&member_number=' + member.number + '&card_number=' + currentCardNumber +
                '&citangname=' + encodeURIComponent(currentCitangName) + '&membername=' + encodeURIComponent(member
                .name);

            var cardHtml =
                '<div class="card" data-member-number="' + member.number + '" data-detail-url="' + detailUrl +
                '" data-log-url="' + logUrl + '">' +
                '<div class="card-layout">' +
                '<div class="card-top-section card-click-area" data-url="' + detailUrl + '">' +
                '<div class="card-left">' +
                '<img src="/image/pcps_log.png" class="pcps-logo-img" alt="培正" onerror="this.style.display=\'none\'">' +
                (memberPhotoUrl ?
                    '<img class="member-photo" src="' + memberPhotoUrl + '" alt="' + safeName +
                    '" loading="lazy" onerror="this.classList.add(\'member-photo-placeholder\'); this.onerror=null; this.parentElement.innerHTML=\'<div class=\\\'member-photo-placeholder\\\'>暂无图片</div>\'">' :
                    '<div class="member-photo-placeholder">暂无图片</div>') +
                '<img src="' + yearLogoUrl +
                '" class="year-logo-img" alt="1973" onerror="this.style.display=\'none\'">' +
                '<div class="citang-name-display">' + safeCitangName + '</div>' +
                '<div class="member-name">' + safeName + '</div>' +
                '</div>' +
                '<div class="card-right">' +
                '<div class="qr-wrapper">' +
                '<div class="qrcode" id="qr-' + member.number + '" data-qr-content="' + encodeURIComponent(
                    qrContent) + '" data-qr-size="' + qrSize + '"></div>' +
                '</div>' +
                '<div class="nft-display">' + formatHash(member.hash) + '</div>' +
                '</div>' +
                '</div>' +
                '<div class="card-bottom-section">' +
                '<div class="button-section">' +
                '<button class="nft-transaction-btn" data-log-url="' + logUrl + '">培正DAO-NFT</button>' +
                '</div>' +
                '</div>' +
                '</div>' +
                '</div>';

            return {
                cardHtml: cardHtml,
                memberNumber: member.number,
                qrContent: qrContent,
                qrSize: qrSize
            };
        }

        async function updateMemberDisplay(members) {
            var container = document.getElementById('membersContainer');
            if (members.length === 0) {
                container.innerHTML = '<div class="loading">暂无成员数据</div>';
                return;
            }

            var sortedMembers = members.slice().sort(function(a, b) {
                return parseInt(a.number) - parseInt(b.number);
            });

            var cardPromises = sortedMembers.map(function(member) {
                return renderMemberCard(member);
            });
            var cards = await Promise.all(cardPromises);

            container.innerHTML = cards.map(function(card) {
                return card.cardHtml;
            }).join('');

            // 生成二维码
            cards.forEach(function(card) {
                setTimeout(function() {
                    var qrDom = document.getElementById('qr-' + card.memberNumber);
                    if (qrDom && card.qrContent) {
                        var targetSize = parseInt(qrDom.getAttribute('data-qr-size')) || getResponsiveQrSize();
                        qrDom.innerHTML = '';
                        new QRCode(qrDom, {
                            text: card.qrContent,
                            width: targetSize,
                            height: targetSize,
                            colorDark: '#000000',
                            colorLight: '#ffffff',
                            correctLevel: QRCode.CorrectLevel.L
                        });
                        var canvasElem = qrDom.querySelector('canvas');
                        if (canvasElem) {
                            canvasElem.style.width = targetSize + 'px';
                            canvasElem.style.height = targetSize + 'px';
                            canvasElem.style.maxWidth = targetSize + 'px';
                            canvasElem.style.margin = '0 auto';
                            canvasElem.style.display = 'block';
                        }
                    } else if (qrDom && !card.qrContent) {
                        var targetSize2 = getResponsiveQrSize();
                        qrDom.innerHTML =
                            '<div style="width:' + targetSize2 + 'px;height:' + targetSize2 +
                            'px;display:flex;align-items:center;justify-content:center;background:#f0f0f0;color:#999;font-size:12px;text-align:center;">无码</div>';
                    }
                }, 50);
            });

            // 绑定卡片点击事件
            var cardsDom = document.querySelectorAll('.card');
            cardsDom.forEach(function(card) {
                var newCard = card.cloneNode(true);
                card.parentNode.replaceChild(newCard, card);

                var detailUrl = newCard.getAttribute('data-detail-url');
                var logUrl = newCard.getAttribute('data-log-url');

                newCard.addEventListener('click', function(event) {
                    if (event.target.closest('.nft-transaction-btn')) {
                        return;
                    }
                    if (detailUrl) {
                        window.location.href = detailUrl;
                    }
                });

                var btn = newCard.querySelector('.nft-transaction-btn');
                if (btn && logUrl) {
                    btn.addEventListener('click', function(event) {
                        event.stopPropagation();
                        window.location.href = logUrl;
                    });
                }
            });
        }

        // ============ 添加新成员 ============
        async function addNewMember() {
            var loginInfo = checkLoginStatus();
            if (!loginInfo) {
                showCustomToast('提示', '请先登录');
                return;
            }
            var owns = await checkCitangOwnership();
            if (!owns) {
                showPermissionDeniedToast();
                return;
            }

            var name = document.getElementById('name').value.trim();

            if (name.length > 0 && /^\d/.test(name)) {
                showCustomToast('提示', '成员姓名第一个字符不能是数字，请修改后重试！');
                var nameInput = document.getElementById('name');
                var nameHint = document.getElementById('memberNameHint');
                if (nameInput) nameInput.classList.add('member-name-input-error');
                if (nameHint) nameHint.classList.add('show');
                return;
            }

            var birth = document.getElementById('birth').value.trim() || '_';
            var birthplace = document.getElementById('birthplace').value.trim() || '_';
            var gender = document.getElementById('gender').value;
            var spouse = document.getElementById('spouse').value.trim() || '_';
            var children = getChildrenList();
            var deathDate = document.getElementById('death_date').value.trim() || '_';
            var deathPlace = document.getElementById('death_place').value.trim() || '_';

            if (!name) {
                showCustomToast('提示', '请输入成员姓名');
                return;
            }

            var saveBtn = document.querySelector('#addMemberForm button[type="button"]');
            var originalBtnText = saveBtn ? saveBtn.textContent : '保存';
            if (saveBtn) {
                saveBtn.disabled = true;
                saveBtn.textContent = '处理中...';
            }

            var latestMemberNumber = 1;
            try {
                var membersResponse = await fetch('/citang/' + encodeURIComponent(currentSurname) + '/' +
                    currentCitangNumber + '/members?card_number=' + currentCardNumber + '&citangname=' +
                    encodeURIComponent(currentCitangName));
                if (membersResponse.ok) {
                    var latestMembers = await membersResponse.json();
                    if (latestMembers && latestMembers.length > 0) {
                        var maxNumber = 0;
                        latestMembers.forEach(function(m) {
                            var match = m.number.toString().match(/^(\d+)/);
                            var num = match ? parseInt(match[1], 10) : 0;
                            if (num > maxNumber) maxNumber = num;
                        });
                        latestMemberNumber = maxNumber + 1;
                    }
                }
            } catch (error) {
                if (allMembers.length > 0) {
                    var maxNumber2 = 0;
                    allMembers.forEach(function(m) {
                        var match = m.number.toString().match(/^(\d+)/);
                        var num = match ? parseInt(match[1], 10) : 0;
                        if (num > maxNumber2) maxNumber2 = num;
                    });
                    latestMemberNumber = maxNumber2 + 1;
                }
            }

            var newNumber = latestMemberNumber.toString();
            var displayName = name;
            try {
                var existingMember = allMembers.find(function(m) { return m.name === name; });
                if (existingMember) displayName = name + 'SN' + newNumber;
            } catch (error) {
                console.error('检查同名成员失败:', error);
            }

            var baseMember = {
                number: newNumber,
                name: displayName,
                birth: birth,
                birthplace: birthplace,
                gender: gender,
                telephone: '_',
                mail: '_',
                hash: '',
                family: { spouse: spouse, child: children },
                death_date: deathDate,
                death_place: deathPlace,
                source: 'user'
            };

            var thread = 1;
            var time = getFormattedTime();
            var price = 100;
            var seller = '18FB5707601BD6A8D79F2F6C18427E85F6EA7EAB3D9AB43948C436D8A1DD1D0E';
            var buyer = loginInfo.walletid;
            var chain = '0000000000000000';
            var next_chain = '0000000000000000';
            var logObj = {
                log: [{ thread: thread, time: time, price: price, seller: seller, buyer: buyer, chain: chain,
                    next_chain: next_chain }],
                nft_holder: { wallet: buyer, phone_number: '', email: '', other: '......' }
            };

            try {
                showCustomToast('处理中', '正在创建成员并扣款100根币，请稍候...');

                var resp = await fetch('/citang/' + encodeURIComponent(currentSurname) + '/' + currentCitangNumber +
                    '/members?card_number=' + currentCardNumber + '&citangname=' + encodeURIComponent(
                    currentCitangName), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ member: baseMember, log: logObj })
                    });

                var result = await resp.json();

                if (!resp.ok || result.success === false) {
                    throw new Error(result.error || '保存失败');
                }

                console.log('成员创建成功，生成的hash:', result.hash);

                allMembers.push(Object.assign({}, baseMember, { hash: result.hash }));
                await updateMemberDisplay(allMembers);
                closeAddMemberForm();

                alert('成员添加成功！\n\n已扣除100根币\n成员名称：' + displayName + '\n编号：' + newNumber + '\n\n点击确定刷新页面');

                logoutAndRefresh();

            } catch (e) {
                console.error('添加成员失败:', e);
                hideCustomToast();
                var errorMessage = e.message;
                if (errorMessage.includes('余额不足')) {
                    alert('添加成员失败：余额不足，需要100根币\n\n请确保您的钱包有足够的根币后重试。');
                } else if (errorMessage.includes('钱包验证失败')) {
                    alert('添加成员失败：钱包验证失败\n\n请重新登录后再试。');
                    logoutAndRefresh();
                } else if (errorMessage.includes('扣款失败')) {
                    alert('添加成员失败：' + errorMessage + '\n\n请稍后重试。');
                } else {
                    alert('添加成员失败：' + (errorMessage || '未知错误') + '\n\n请稍后重试。');
                }

            } finally {
                if (saveBtn) {
                    saveBtn.disabled = false;
                    saveBtn.textContent = originalBtnText;
                }
            }
        }

        function closeAddMemberForm() {
            document.getElementById('addMemberModal').style.display = 'none';
            document.getElementById('name').value = '';
            document.getElementById('birth').value = '';
            document.getElementById('birthplace').value = '';
            document.getElementById('gender').value = '男';
            document.getElementById('spouse').value = '';
            document.getElementById('death_date').value = '';
            document.getElementById('death_place').value = '';

            resetChildrenList();

            var memberNameInput = document.getElementById('name');
            var memberNameHint = document.getElementById('memberNameHint');
            if (memberNameInput) {
                memberNameInput.classList.remove('member-name-input-error');
            }
            if (memberNameHint) {
                memberNameHint.classList.remove('show');
            }

            // 关闭表单后退出登录
            logoutAndRefresh();
        }

        function goBackToCitangDetail() {
            var urlParams = new URLSearchParams(window.location.search);
            var surname = decodeURIComponent(urlParams.get('surname') || '');
            var citangNumber = urlParams.get('citang_number') || '';
            var cardNumber = urlParams.get('card_number') || '';
            var citangname = decodeURIComponent(urlParams.get('citangname') || '');
            window.location.href = 'citang_detail.html?surname=' + encodeURIComponent(surname) + '&citang_number=' +
                citangNumber + '&card_number=' + cardNumber + '&name=' + encodeURIComponent(citangname);
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============ 初始化 ============
        async function init() {
            var urlParams = new URLSearchParams(window.location.search);
            currentSurname = decodeURIComponent(urlParams.get('surname'));
            currentCitangNumber = urlParams.get('citang_number');
            currentCardNumber = urlParams.get('card_number');
            currentCitangName = decodeURIComponent(urlParams.get('citangname') || '');
            var titleElement = document.getElementById('introduce');
            if (currentSurname && currentCitangNumber && currentCardNumber && currentCitangName) {
                titleElement.innerText = currentSurname + '.' + currentCitangName + ': 成员';
            }

            if (!currentSurname || !currentCitangNumber || !currentCardNumber) {
                showCustomToast('参数错误', '缺少必要参数: 姓氏、祠堂编号或卡号');
                return;
            }

            try {
                var citangResponse = await fetch('/api/citang/details?card_number=' + currentCardNumber +
                    '&citang_number=' + currentCitangNumber + '&surname=' + encodeURIComponent(currentSurname) +
                    '&name=' + encodeURIComponent(currentCitangName));
                if (citangResponse.ok) {
                    var citangData = await citangResponse.json();
                    currentCitangHash = citangData.hash || '';
                    currentCitangOwner = citangData.nft_holder ? citangData.nft_holder.wallet || '' : '';
                    privacyLevel = citangData.privacy_level || 'public';
                }

                var response = await fetch('/citang/' + encodeURIComponent(currentSurname) + '/' +
                    currentCitangNumber + '/members?card_number=' + currentCardNumber + '&citangname=' +
                    encodeURIComponent(currentCitangName));
                if (!response.ok) throw new Error('数据加载失败');
                allMembers = await response.json();
                await updateMemberDisplay(allMembers);

                var loginInfo = checkLoginStatus();
                if (loginInfo) {
                    await checkCitangOwnership();
                    updateAddMemberButtonVisibility();
                }

                // 成员姓名输入验证
                var memberNameInput = document.getElementById('name');
                if (memberNameInput) {
                    memberNameInput.addEventListener('input', function(e) {
                        var value = e.target.value;
                        var hint = document.getElementById('memberNameHint');
                        if (value.length > 0 && /^\d/.test(value)) {
                            e.target.classList.add('member-name-input-error');
                            if (hint) hint.classList.add('show');
                        } else {
                            e.target.classList.remove('member-name-input-error');
                            if (hint) hint.classList.remove('show');
                        }
                    });
                }

                // 添加儿女按钮
                var addChildBtn = document.getElementById('addChildBtn');
                if (addChildBtn) {
                    addChildBtn.addEventListener('click', function() {
                        addChildInput();
                    });
                }

                initChildrenList();

            } catch (error) {
                console.error(error);
                showCustomToast('加载失败', '数据加载失败，请稍后重试');
            }
        }

        // 响应窗口尺寸变化重新生成二维码
        var resizeTimer;
        window.addEventListener('resize', function() {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                if (allMembers.length > 0 && document.getElementById('membersContainer').innerHTML.includes(
                        'card')) {
                    updateMemberDisplay(allMembers);
                }
            }, 200);
        });

        // 点击外部关闭
        window.onclick = function(event) {
            var addModal = document.getElementById('addMemberModal');
            var toast = document.getElementById('customToast');
            var statusOverlay = document.getElementById('statusOverlay');

            if (event.target === addModal) {
                // 不允许点击外部关闭，防止误操作
            }
            if (event.target === toast) {
                hideCustomToast();
            }
            if (event.target === statusOverlay) {
                statusOverlay.style.display = 'none';
            }
        };

        // 页面关闭时退出登录
        window.addEventListener('beforeunload', function() {
            clearWalletLogin();
        });

        // 页面加载重置标志
        window.onload = function() {
            loginPurpose = '';
            pendingAddAfterLogin = false;
            ownsCitang = false;
        };

        init();
    </script>
</body>

</html>
